trigger: none

parameters:
  - name: objectId
    displayName: "Object ID (principal to receive the role)"
    type: string

  - name: role
    displayName: "Role to assign"
    type: string
    default: 'Contributor'
    values:
      - 'Owner'
      - 'Contributor'
      - 'Reader'
      - 'AcrPull'

  - name: resourceGroup
    displayName: "Resource Group Name"
    type: string

  - name: principalType
    displayName: "Principal Type"
    type: string
    default: 'User'
    values:
      - 'User'
      - 'Group'
      - 'ServicePrincipal'

variables:
  - group: Arthur_VG

stages:
  - stage: AssignRBAC
    displayName: 'Assign ${{ parameters.role }} to ${{ parameters.objectId }}'
    jobs:
      - job: AssignRBAC
        displayName: 'Deploy Role Assignment'
        steps:
          - task: AzureCLI@2
            displayName: '1. Validate RBAC Bicep'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group validate \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --template-file infra_AI_Foundry/bicep_files/rbac_assignments.bicep \
                  --parameters principalId='${{ parameters.objectId }}' \
                               roleName='${{ parameters.role }}' \
                               principalType='${{ parameters.principalType }}'

          - task: AzureCLI@2
            displayName: '2. Assign Role'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --template-file infra_AI_Foundry/bicep_files/rbac_assignments.bicep \
                  --parameters principalId='${{ parameters.objectId }}' \
                               roleName='${{ parameters.role }}' \
                               principalType='${{ parameters.principalType }}'

          - task: AzureCLI@2
            displayName: '3. Smoke Test — Verify Assignment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az role assignment list \
                  --resource-group ${{ parameters.resourceGroup }} \
                  --assignee ${{ parameters.objectId }} \
                  --query "[].{role:roleDefinitionName, principal:principalName, scope:scope}" \
                  -o table
