trigger: none

parameters:
  - name: personName
    displayName: "Person/Owner Name"
    type: string
    default: 'Arthur'
  - name: location
    displayName: "Azure Region"
    type: string
    default: 'brazilsouth'
  - name: projectDisplayName
    displayName: "Foundry Project Display Name"
    type: string
    default: 'Default Project'
  - name: projectDescription
    displayName: "Foundry Project Description"
    type: string
    default: 'Default AI Foundry project'

  # Stage selection
  - name: runDev
    displayName: "Deploy to Dev?"
    type: boolean
    default: true
  - name: runTest
    displayName: "Deploy to Test?"
    type: boolean
    default: false
  - name: runProd
    displayName: "Deploy to Prod?"
    type: boolean
    default: false

variables:
  - group: Arthur_VG
  - name: templateInfra
    value: 'infra_AI_Foundry/bicep_files/azure_aifoundry_infra.bicep'
  - name: rgDev
    value: 'rg-${{ parameters.personName }}-dev'
  - name: rgTest
    value: 'rg-${{ parameters.personName }}-test'
  - name: rgProd
    value: 'rg-${{ parameters.personName }}-prod'

stages:
  - stage: Lint
    displayName: 'Lint Bicep'
    jobs:
      - job: LintBicep
        steps:
          - script: az bicep build --file $(templateInfra)
            displayName: 'Bicep Lint'

  # --- DEV STAGE ---
  - stage: Deploy_Dev
    displayName: 'Deploy Infra to Development'
    dependsOn: Lint
    condition: and(succeeded(), eq('${{ parameters.runDev }}', 'true'))
    variables:
      - name: envName
        value: 'dev'
      - name: rgName
        value: $(rgDev)
    jobs:
      - job: DeployJob
        displayName: 'Validation and Deployment'
        steps:
          - task: AzureCLI@2
            displayName: '1. Ensure Resource Group Exists'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: az group create --name $(rgName) --location ${{ parameters.location }}

          - task: AzureCLI@2
            displayName: '2. Validate Bicep Deployment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group validate \
                  --resource-group $(rgName) \
                  --template-file $(templateInfra) \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               projectDisplayName='${{ parameters.projectDisplayName }}' \
                               projectDescription='${{ parameters.projectDescription }}'

          - task: AzureCLI@2
            displayName: '3. What-If Preview'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(rgName) \
                  --template-file $(templateInfra) \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               projectDisplayName='${{ parameters.projectDisplayName }}' \
                               projectDescription='${{ parameters.projectDescription }}'

          - task: AzureCLI@2
            displayName: '4. Execute Deployment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                OUTPUTS=$(az deployment group create \
                  --resource-group $(rgName) \
                  --template-file $(templateInfra) \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               projectDisplayName='${{ parameters.projectDisplayName }}' \
                               projectDescription='${{ parameters.projectDescription }}' \
                  --query properties.outputs -o json)

                echo "##vso[task.setvariable variable=foundryAccountName]$(echo "$OUTPUTS"    | jq -r '.foundryAccountName.value')"
                echo "##vso[task.setvariable variable=storageAccountName]$(echo "$OUTPUTS"    | jq -r '.storageAccountName.value')"
                echo "##vso[task.setvariable variable=keyVaultName]$(echo "$OUTPUTS"          | jq -r '.keyVaultName.value')"
                echo "##vso[task.setvariable variable=containerRegistryName]$(echo "$OUTPUTS" | jq -r '.containerRegistryName.value')"
                echo "##vso[task.setvariable variable=appInsightsName]$(echo "$OUTPUTS"       | jq -r '.appInsightsName.value')"

          - task: AzureCLI@2
            displayName: '5. Smoke Test — All Resources'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "=== AI Foundry Account ==="
                az cognitiveservices account show --name $(foundryAccountName) --resource-group $(rgName) --query "{name:name, endpoint:properties.endpoint}" -o table

                echo "=== Storage Account ==="
                az storage account show --name $(storageAccountName) --resource-group $(rgName) --query "{name:name, sku:sku.name}" -o table

                echo "=== Key Vault ==="
                az keyvault show --name $(keyVaultName) --resource-group $(rgName) --query "{name:name, uri:properties.vaultUri}" -o table

                echo "=== Container Registry ==="
                az acr show --name $(containerRegistryName) --resource-group $(rgName) --query "{name:name, loginServer:loginServer}" -o table

                echo "=== Application Insights ==="
                az monitor app-insights component show --app $(appInsightsName) --resource-group $(rgName) --query "{name:name, instrumentationKey:instrumentationKey}" -o table

  # --- TEST STAGE ---
  - stage: Deploy_Test
    displayName: 'Deploy Infra to Test'
    dependsOn: Deploy_Dev
    condition: and(not(failed()), eq('${{ parameters.runTest }}', 'true'))
