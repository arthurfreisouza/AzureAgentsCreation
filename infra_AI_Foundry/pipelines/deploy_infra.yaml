              inlineScript: az group create --name $(rgName) --location ${{ parameters.location }}

          - task: AzureCLI@2
            displayName: '2. Validate Bicep Deployment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group validate \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               modelDeploymentName='${{ parameters.modelDeploymentName }}' \
                               modelName='${{ parameters.modelName }}' \
                               modelVersion='${{ parameters.modelVersion }}' \
                               modelSkuName='${{ parameters.modelSkuName }}' \
                               modelCapacity=${{ parameters.modelCapacity }}

          - task: AzureCLI@2
            displayName: '3. What-If Preview'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(rgName) \
