trigger: none

parameters:
  - name: personName
    displayName: "Person/Owner Name"
    type: string
    default: 'Arthur'
  - name: location
    displayName: "Azure Region"
    type: string
    default: 'brazilsouth'
  - name: templateML
    displayName: "Bicep Template Path"
    type: string
    default: 'infra_AI_Foundry/bicep_files/azure_aifoundry_deploy.bicep' # Modern Foundry resource (CognitiveServices/accounts kind=AIServices + projects)

  # --- Model deployment parameters ---
  # The deployment name MUST match MODEL_NAME in the agent's .env file.
  - name: modelDeploymentName
    displayName: "Model Deployment Name (must match agent .env MODEL_NAME)"
    type: string
    default: 'gpt-4.1'
  - name: modelName
    displayName: "OpenAI Model"
    type: string
    default: 'gpt-4.1'
    values:
      - 'gpt-4.1'
      - 'gpt-4.1-mini'
      - 'gpt-4o'
      - 'gpt-4o-mini'
      - 'o3-mini'
      - 'text-embedding-3-large'
      - 'text-embedding-3-small'
  - name: modelVersion
    displayName: "Model Version (e.g. 2025-04-14 for gpt-4.1)"
    type: string
    default: '2025-04-14'
  - name: modelSkuName
    displayName: "Deployment SKU"
    type: string
    default: 'GlobalStandard'
    values:
      - 'GlobalStandard'
      - 'Standard'
      - 'ProvisionedManaged'
      - 'DataZoneStandard'
  - name: modelCapacity
    displayName: "Capacity (thousand TPM for Standard SKUs)"
    type: number
    default: 50

  # Selection parameters for stages[cite: 1]
  - name: runDev
    displayName: "Deploy to Dev?"
    type: boolean
    default: true
  - name: runTest
    displayName: "Deploy to Test?"
    type: boolean
    default: false
  - name: runProd
    displayName: "Deploy to Prod?"
    type: boolean
    default: false

variables:
  - group: Arthur_VG 
  # Consistent naming convention[cite: 1]
  - name: rgDev
    value: 'rg-${{ parameters.personName }}-dev'
  - name: rgTest
    value: 'rg-${{ parameters.personName }}-test'
  - name: rgProd
    value: 'rg-${{ parameters.personName }}-prod'

stages:
  - stage: Lint
    displayName: 'Lint Bicep'
    jobs:
      - job: LintBicep
        steps:
          - script: az bicep build --file ${{ parameters.templateML }}
            displayName: 'Bicep Lint'

  # --- DEV STAGE ---
  - stage: Deploy_Dev
    displayName: 'Deploy to Development'
    dependsOn: Lint
    condition: and(succeeded(), eq('${{ parameters.runDev }}', 'true'))
    variables:
      - name: envName
        value: 'dev'
      - name: rgName
        value: $(rgDev)
    jobs:
      - job: DeployJob
        displayName: 'Validation and Deployment'
        steps:
          - task: AzureCLI@2
            displayName: '1. Ensure Resource Group Exists'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: az group create --name $(rgName) --location ${{ parameters.location }}

          - task: AzureCLI@2
            displayName: '2. Validate Bicep Deployment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group validate \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               modelDeploymentName='${{ parameters.modelDeploymentName }}' \
                               modelName='${{ parameters.modelName }}' \
                               modelVersion='${{ parameters.modelVersion }}' \
                               modelSkuName='${{ parameters.modelSkuName }}' \
                               modelCapacity=${{ parameters.modelCapacity }}

          - task: AzureCLI@2
            displayName: '3. What-If Preview'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               modelDeploymentName='${{ parameters.modelDeploymentName }}' \
                               modelName='${{ parameters.modelName }}' \
                               modelVersion='${{ parameters.modelVersion }}' \
                               modelSkuName='${{ parameters.modelSkuName }}' \
                               modelCapacity=${{ parameters.modelCapacity }}

          - task: AzureCLI@2
            displayName: '4. Execute Deployment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Querying foundryAccountName from the modern Foundry resource
                FOUNDRY_NAME=$(az deployment group create \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               modelDeploymentName='${{ parameters.modelDeploymentName }}' \
                               modelName='${{ parameters.modelName }}' \
                               modelVersion='${{ parameters.modelVersion }}' \
                               modelSkuName='${{ parameters.modelSkuName }}' \
                               modelCapacity=${{ parameters.modelCapacity }} \
                  --query properties.outputs.foundryAccountName.value -o tsv)
                echo "##vso[task.setvariable variable=foundryAccountName]$FOUNDRY_NAME"

          - task: AzureCLI@2
            displayName: '5. Smoke Test'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: az cognitiveservices account show --name $(foundryAccountName) --resource-group $(rgName)

  # --- TEST STAGE ---
  - stage: Deploy_Test
    displayName: 'Deploy to Test'
    dependsOn: Deploy_Dev
    condition: and(not(failed()), eq('${{ parameters.runTest }}', 'true'))
    variables:
      - name: envName
        value: 'test'
      - name: rgName
        value: $(rgTest)
    jobs:
      - job: DeployJob
        displayName: 'Validation and Deployment'
        steps:
          - task: AzureCLI@2
            displayName: '1. Ensure Resource Group Exists'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: az group create --name $(rgName) --location ${{ parameters.location }}

          - task: AzureCLI@2
            displayName: '2. Validate Bicep Deployment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group validate \
