                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               modelDeploymentName='${{ parameters.modelDeploymentName }}' \
                               modelName='${{ parameters.modelName }}' \
                               modelVersion='${{ parameters.modelVersion }}' \
                               modelSkuName='${{ parameters.modelSkuName }}' \
                               modelCapacity=${{ parameters.modelCapacity }}

          - task: AzureCLI@2
            displayName: '3. What-If Preview'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group what-if \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               modelDeploymentName='${{ parameters.modelDeploymentName }}' \
                               modelName='${{ parameters.modelName }}' \
                               modelVersion='${{ parameters.modelVersion }}' \
                               modelSkuName='${{ parameters.modelSkuName }}' \
                               modelCapacity=${{ parameters.modelCapacity }}

          - task: AzureCLI@2
            displayName: '4. Execute Deployment'
            inputs:
              azureSubscription: '$(service_conn)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                # Querying foundryAccountName from the modern Foundry resource
                FOUNDRY_NAME=$(az deployment group create \
                  --resource-group $(rgName) \
                  --template-file ${{ parameters.templateML }} \
                  --parameters personName='${{ parameters.personName }}' \
                               environment='$(envName)' \
                               location='${{ parameters.location }}' \
                               modelDeploymentName='${{ parameters.modelDeploymentName }}' \
                               modelName='${{ parameters.modelName }}' \
                               modelVersion='${{ parameters.modelVersion }}' \
                               modelSkuName='${{ parameters.modelSkuName }}' \
                               modelCapacity=${{ parameters.modelCapacity }} \
                  --query properties.outputs.foundryAccountName.value -o tsv)
                echo "##vso[task.setvariable variable=foundryAccountName]$FOUNDRY_NAME"

  # --- PROD STAGE ---
  - stage: Deploy_Prod
    displayName: 'Deploy to Production'
    dependsOn: Deploy_Test
    condition: and(not(failed()), eq('${{ parameters.runProd }}', 'true'))
    variables:
      - name: envName
        value: 'prod'
      - name: rgName
        value: $(rgProd)
    jobs:
      - job: DeployJob
        displayName: 'Validation and Deployment'
        steps:
          - task: AzureCLI@2
